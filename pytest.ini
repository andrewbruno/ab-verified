; Test configuration.
;
; The suite is the executable half of NFR-15: every state machine has
; exhaustive transition tests, and every Row Level Security policy has a
; paired allow and deny test (R2). It runs in CI on every pull request,
; alongside ruff, mypy, bandit and pip-audit (§11.1), and a red suite blocks
; the merge.
;
; Every test builds a throwaway SQLite database in a temporary directory. The
; shared development database at var/ab_verified.sqlite3 is never touched; see
; the guard in tests/conftest.py.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --tb=short
filterwarnings =
    error::DeprecationWarning:app.*
