name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Lint
        run: ruff check app scripts tests

      - name: Test
        run: python -m pytest -q
        env:
          APP_ENV: test
          DEMO_MODE: "true"
          SESSION_SECRET: ci-only-secret
          CRON_SECRET: ci-only-secret

      - name: Application imports cleanly
        run: python -c "from app.main import create_app; create_app()"
        env:
          APP_ENV: test
          DEMO_MODE: "true"

  # FR-158: a deployment check fails the build if demo seed data is present in
  # the production database. It runs only for pushes to main, where the
  # production credentials are available.
  no-demo-rows-in-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_no_demo_rows.py
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
