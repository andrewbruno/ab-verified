name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint and test are separate jobs on purpose. They used to be two steps of one
# job, which meant a style nit stopped the suite from running at all and the
# only signal on the commit was "test: failure" with no test having executed.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Pinned. An unpinned linter turns every upstream release into a
      # potential red build on a day nobody touched the repository, which is
      # how this workflow came to be failing on rules that did not exist when
      # it was written. ruff.toml pins the rules to go with it.
      - name: Install ruff
        run: python -m pip install ruff==0.16.6

      - name: Lint
        run: ruff check app scripts tests e2e

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1

      - name: Unit and integration tests
        run: python -m pytest -v --junit-xml=junit.xml
        env:
          APP_ENV: test
          DEMO_MODE: "true"
          SESSION_SECRET: ci-only-secret
          CRON_SECRET: ci-only-secret

      - name: Publish the test summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("junit.xml")
          if not report.exists():
              print("## Tests\n\nNo test report was produced: the suite did not run.")
              raise SystemExit(0)

          suite = ET.parse(report).getroot().find("testsuite")
          total = int(suite.get("tests", 0))
          failures = int(suite.get("failures", 0))
          errors = int(suite.get("errors", 0))
          skipped = int(suite.get("skipped", 0))
          passed = total - failures - errors - skipped

          print("## Tests\n")
          print(f"**{passed} passed**, {failures} failed, {errors} errored, "
                f"{skipped} skipped, out of {total} in {float(suite.get('time', 0)):.1f}s\n")
          if failures or errors:
              print("### What failed\n")
              for case in suite.iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      print(f"- `{case.get('classname')}.{case.get('name')}`: "
                            f"{(bad.get('message') or '').splitlines()[0][:200]}")
          PY

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml

      - name: Application imports cleanly
        run: python -c "from app.main import create_app; create_app()"
        env:
          APP_ENV: test
          DEMO_MODE: "true"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Install the browser
        run: python -m playwright install --with-deps chromium

      - name: End-to-end journey
        run: python -m pytest e2e -v
        env:
          APP_ENV: test
          DEMO_MODE: "true"
          SESSION_SECRET: ci-only-secret
          CRON_SECRET: ci-only-secret

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: e2e/artifacts/

  # Trunk-based development: main is where everyone pushes, so production is
  # reached through this job rather than through Vercel's own Git integration.
  # The difference is `needs`. Vercel deploys on push without waiting for
  # anything; this cannot start until lint, both test suites and the FR-158
  # check have passed, so a red commit never reaches production.
  #
  # Requires one repository secret: VERCEL_TOKEN (Vercel → Account Settings →
  # Tokens, scoped to the AB team). The org and project ids below are
  # identifiers rather than credentials, and are useless without the token.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [lint, test, e2e, no-demo-rows-in-production]
    concurrency:
      # Never let two pushes race to production; the newer one wins and the
      # older is cancelled rather than landing on top of it.
      group: production-deploy
      cancel-in-progress: true
    environment:
      name: production
      url: https://ab-verified-one.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_NDrkJARRpNECdHi78wHFUoZC
      VERCEL_PROJECT_ID: prj_icEjswspPeeuhJUJ2SzVmm2ZmrLZ
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `vercel build` shells out to uv for a Python project and fails with
      # "uv is required but was not found in PATH" without it.
      - uses: astral-sh/setup-uv@v5

      - name: Fail early if the token is missing
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install the Vercel CLI
        run: npm install --global vercel@59.13.1

      - name: Pull the production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Built here rather than on Vercel, so the artifact that ships is the one
      # this workflow produced from the commit the tests just passed against.
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"

      # Against the production alias, not the deployment-specific URL the
      # deploy step prints. Vercel's Deployment Protection redirects those to
      # SSO, so they answer 302 to an anonymous client however healthy the
      # deployment is. The alias is what a visitor actually reaches.
      - name: Smoke test what was just deployed
        run: |
          set -e
          url="https://ab-verified-one.vercel.app"
          echo "Deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          for path in / /docs /static/css/app.css; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

  # FR-158: a deployment check fails the build if demo seed data is present in
  # the production database. It runs only for pushes to main, where the
  # production credentials are available.
  no-demo-rows-in-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Guarded deliberately. With DATABASE_URL empty the script falls back to
      # the local SQLite database, finds the seeded demo fixture and fails,
      # which says nothing about production and would block the deploy. Skip
      # loudly instead, so the gate is honest about not having run.
      - name: Check production carries no demo data
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::PRODUCTION_DATABASE_URL is not set, so FR-158 was not verified against production."
            echo "FR-158 **not checked**: no production database configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python scripts/check_no_demo_rows.py
