{% extends "layout/base.html" %}
{% block title %}{{ heading }} · AB-Verified{% endblock %}
{% block wrapclass %}wrap-narrow{% endblock %}
{% block content %}
<div class="stack">
  <p class="label">Error {{ status }}</p>
  <h1>{{ heading }}</h1>
  <p class="lead">{{ message }}</p>
  <p><a class="btn" href="{{ '/staff' if me.is_staff else ('/dashboard' if me.is_authenticated else '/') }}">Back to safety</a></p>
</div>
{% endblock %}
