# AB-Verified: Supabase CLI project configuration.
#
# The hosted project is in ap-southeast-2 (Sydney). Data residency is a
# requirement, not a preference: NFR-06 puts the database, object storage and
# the serverless functions in Australia, under the Privacy Act 1988 and the
# Australian Privacy Principles. The region is set on the hosted project, not
# in this file, so it is recorded here as a note: any project this repository
# is linked to must be ap-southeast-2, with the Vercel functions pinned to
# syd1 to match.
#
# The CLI is installed as the standalone binary, never from npm (PC1).

project_id = "ab-verified"

[api]
enabled = true
port = 54321
# Only the application schemas are exposed. The app schema holds the Row Level
# Security helpers (§9.1) and is deliberately not reachable over the API.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# NFR-02: the Staff queues page 1,000 rows at a time at most.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Supabase PostgreSQL 15 (§11.1).
major_version = 15

[db.pooler]
enabled = true
port = 54329
# §11.1: serverless functions must not hold direct connections. Transaction
# mode is the supported pattern, and the pooler does not support prepared
# statements, so the application disables them.
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# FR-154: the demo fixture is seeded by `supabase db reset`, from one file.
[db.seed]
enabled = true
sql_paths = ["./seed/demo_seed.sql"]

[studio]
enabled = true
port = 54323

# Local mail catcher. FR-157 means nothing addressed to the reserved demo
# domain should reach it in any case.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# §13: uploads are restricted by type and size.
file_size_limit = "10MiB"

# §9.4: private buckets with path-prefix policies and signed URLs. The policies
# themselves are in migrations/0002_rls_policies.sql.
[storage.buckets.documents]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf", "image/png", "image/jpeg"]

[storage.buckets.bid-attachments]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf", "image/png", "image/jpeg"]

[auth]
enabled = true
site_url = "http://127.0.0.1:8000"
additional_redirect_urls = ["http://127.0.0.1:8000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# §13: identifiers are UUIDs and anonymous sessions have no place in a
# marketplace where every actor is a verified business.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
# FR-102 wants a 24-hour TTL on the confirmation link. That is a GoTrue
# setting (MAILER_OTP_EXP) on the hosted project, not a field here.

[auth.sms]
enable_signup = true
enable_confirmations = true
# FR-103 wants a six-digit code valid ten minutes, at most five attempts and
# three resends an hour. Length and expiry are GoTrue settings on the hosted
# project; the resend limit is this one.
max_frequency = "1m0s"
template = "Your AB-Verified code is {{ .Code }}. It expires in 10 minutes."

# FR-109: Staff accounts require TOTP multi-factor authentication.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# §9.1: the hook that adds app_role and org_id to the access token. Every
# policy reads those two claims, so without this the whole authorisation model
# denies everything. The function is created in migrations/0001_schema.sql.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/app/custom_access_token_hook"

# PC1: no Node.js anywhere, so there are no Deno edge functions either. Worker
# routes are Python on Vercel, invoked by Vercel Cron (§11.1).
[edge_runtime]
enabled = false

[analytics]
enabled = false
